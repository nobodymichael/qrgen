<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRGen — Michał Plata</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-black">
    
    <!-- Top Navigation Bar -->
    <header class="border-b border-zinc-800/80 bg-zinc-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="https://placekwlb.github.io/" class="inline-flex items-center gap-2 text-sm font-medium text-zinc-400 hover:text-white transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                <span>Strona główna</span>
            </a>
            <span class="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">QRGen Tool</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
        
        <!-- Controls -->
        <div class="space-y-6">
            <div>
                <h1 class="text-2xl font-bold tracking-tight mb-2">Generator QR</h1>
                <p class="text-zinc-400 text-sm">Wpisz tekst lub link, aby błyskawicznie wygenerować kod QR.</p>
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-mono uppercase tracking-wider text-zinc-400">Tekst lub adres URL</label>
                <textarea id="qrInput" rows="4" placeholder="example.com"
                    class="w-full p-3 bg-zinc-900/80 border border-zinc-800 rounded-xl text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm font-mono resize-none">https://placekwlb.github.io</textarea>
                <div id="autoLinkNotice" class="text-xs text-emerald-400 font-mono hidden flex items-center gap-1.5 mt-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                    Wykryto link → automatycznie dodano https://
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="block text-xs font-mono uppercase tracking-wider text-zinc-400">Rozmiar (px)</label>
                    <select id="qrSize" class="w-full p-2.5 bg-zinc-900 border border-zinc-800 rounded-xl text-sm font-mono text-zinc-200 focus:outline-none focus:border-emerald-500">
                        <option value="250">250 x 250</option>
                        <option value="350" selected>350 x 350</option>
                        <option value="500">500 x 500</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="block text-xs font-mono uppercase tracking-wider text-zinc-400">Kolor kodu</label>
                    <input type="color" id="qrColor" value="#ffffff" class="w-full h-10 bg-zinc-900 border border-zinc-800 rounded-xl cursor-pointer p-1">
                </div>
            </div>
        </div>

        <!-- Preview Card -->
        <div class="bg-zinc-900/40 border border-zinc-800/80 rounded-2xl p-6 flex flex-col items-center justify-center text-center">
            <div class="bg-white p-4 rounded-xl shadow-xl mb-6">
                <canvas id="qrCanvas"></canvas>
            </div>
            <button id="downloadBtn" class="w-full py-2.5 px-4 bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-semibold rounded-xl text-sm transition-colors font-mono cursor-pointer">
                Pobierz PNG
            </button>
        </div>
    </main>

    <footer class="border-t border-zinc-900 py-6 text-center text-xs text-zinc-600 font-mono">
        Michał Plata &copy; 2026
    </footer>

    <script>
        const input = document.getElementById('qrInput');
        const sizeSelect = document.getElementById('qrSize');
        const colorPicker = document.getElementById('qrColor');
        const downloadBtn = document.getElementById('downloadBtn');
        const notice = document.getElementById('autoLinkNotice');

        const qr = new QRious({
            element: document.getElementById('qrCanvas'),
            size: 350,
            value: input.value,
            background: 'white',
            foreground: '#000000'
        });

        function updateQR() {
            let val = input.value;
            
            // Inteligentna detekcja linku
            const domainRegex = /^[a-zA-Z0-9][-a-zA-Z0-9]*(\.[a-zA-Z0-9][-a-zA-Z0-9]*)+(\/.*)?$/;
            if (val.trim() && !val.includes('://') && domainRegex.test(val.trim())) {
                val = 'https://' + val.trim();
                notice.classList.remove('hidden');
            } else {
                notice.classList.add('hidden');
            }

            qr.set({
                value: val || 'https://placekwlb.github.io',
                size: parseInt(sizeSelect.value),
                foreground: colorPicker.value
            });
        }

        input.addEventListener('input', updateQR);
        sizeSelect.addEventListener('change', updateQR);
        colorPicker.addEventListener('input', updateQR);

        downloadBtn.addEventListener('click', () => {
            const canvas = document.getElementById('qrCanvas');
            const link = document.createElement('a');
            link.download = 'qrcode.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
